[project]
name = "domain"
version = "0.1.0"
description = "Shared domain models and API contracts for Audit Assistant"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain"]
