name: release

# Bump these when you want a new major/minor line. Patch auto-increments
# from the latest matching tag (vMAJOR.MINOR.*). First tag for a line is .0.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MAJOR: 0
  MINOR: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: extractions/setup-just@v3

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Lint, typecheck, imports, tests
        run: just check

  version:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail
          major="${{ env.MAJOR }}"
          minor="${{ env.MINOR }}"
          prefix="v${major}.${minor}."
          latest="$(git tag -l "${prefix}*" --sort=-v:refname | head -n1 || true)"
          if [[ -z "${latest}" ]]; then
            patch=0
          else
            patch="${latest##*.}"
            if [[ ! "${patch}" =~ ^[0-9]+$ ]]; then
              echo "Could not parse patch from tag: ${latest}"
              exit 1
            fi
            patch=$((patch + 1))
          fi
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${tag}"

  build-container:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-cli-tui:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set package versions
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for f in \
            pyproject.toml \
            services/backend/pyproject.toml \
            cli/pyproject.toml \
            tui/pyproject.toml
          do
            sed -i -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" "$f"
          done
          sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"${VERSION}\"/" cli/src/cli/__init__.py

      - name: Build backend, CLI, and TUI wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          uv build --package backend --out-dir dist
          uv build --package cli --out-dir dist
          uv build --package tui --out-dir dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist/*.whl

  release:
    needs: [version, build-container, build-cli-tui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheels
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*.whl
          body: |
            ## Container
            ```text
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ```

            ## Python packages
            Wheels attached: `backend`, `cli` (`aiditor`), `tui` (`aiditor-tui`).
