[importlinter]
root_packages =
    backend
    cli
    tui

[importlinter:contract:domain-independence]
name = backend.domain imports nothing from the rest of the project
type = independence
modules =
    backend.domain

[importlinter:contract:application-core-forbidden]
name = application services/rag/agent must not import infrastructure or bootstrap
type = forbidden
source_modules =
    backend.application.services
    backend.application.llm
    backend.application.parsing
    backend.application.repositories
    backend.application.storage
    backend.application.dto
    backend.application.rag.retrieve
    backend.application.rag.worker.process_item
    backend.application.agents
    backend.application.tools
forbidden_modules =
    backend.infrastructure
    backend.bootstrap
    cli
    tui

[importlinter:contract:application-no-http-contracts]
name = application core must not import HTTP API contracts
type = forbidden
source_modules =
    backend.application.services
    backend.application.agents
    backend.application.tools
    backend.application.dto
    backend.application.rag.retrieve
    backend.application.rag.worker.process_item
forbidden_modules =
    backend.application.api

[importlinter:contract:cli-isolation]
name = cli must not import backend internals
type = forbidden
source_modules =
    cli
forbidden_modules =
    backend.infrastructure
    backend.bootstrap
    backend.config
    backend.logging
    backend.application.services
    backend.application.llm
    backend.application.parsing
    backend.application.repositories
    backend.application.storage
    backend.application.dto
    backend.application.rag
    backend.application.agents
    backend.application.tools
    tui

[importlinter:contract:tui-isolation]
name = tui must not import backend internals
type = forbidden
source_modules =
    tui
forbidden_modules =
    backend.infrastructure
    backend.bootstrap
    backend.config
    backend.logging
    backend.application.services
    backend.application.llm
    backend.application.parsing
    backend.application.repositories
    backend.application.storage
    backend.application.dto
    backend.application.rag
    backend.application.agents
    backend.application.tools

[importlinter:contract:tui-no-cli-commands]
name = tui must not import cli commands or main
type = forbidden
source_modules =
    tui
forbidden_modules =
    cli.commands
    cli.main
