[importlinter]
root_packages =
    backend
    cli

[importlinter:contract:domain-independence]
name = backend.domain imports nothing from the rest of the project
type = independence
modules =
    backend.domain

[importlinter:contract:application-core-forbidden]
name = application use cases/rag/ingestion/ports must not import infrastructure or bootstrap
type = forbidden
source_modules =
    backend.application.ask_question
    backend.application.create_engagement
    backend.application.get_document
    backend.application.get_session
    backend.application.get_upload
    backend.application.ingest_directory
    backend.application.list_documents
    backend.application.list_sessions
    backend.application.list_uploads
    backend.application.upload_documents
    backend.application.ports
    backend.application.dto
    backend.application.rag
    backend.application.ingestion
forbidden_modules =
    backend.infrastructure
    backend.bootstrap
    cli

[importlinter:contract:cli-isolation]
name = cli must not import backend internals
type = forbidden
source_modules =
    cli
forbidden_modules =
    backend.infrastructure
    backend.bootstrap
    backend.config
    backend.logging
    backend.application.ask_question
    backend.application.create_engagement
    backend.application.get_document
    backend.application.get_session
    backend.application.get_upload
    backend.application.ingest_directory
    backend.application.list_documents
    backend.application.list_sessions
    backend.application.list_uploads
    backend.application.upload_documents
    backend.application.ports
    backend.application.dto
    backend.application.rag
    backend.application.ingestion
    backend.application.worker
