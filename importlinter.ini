[importlinter]
root_packages =
    domain
    backend
    cli

[importlinter:contract:domain-independence]
name = Domain imports nothing from the project
type = independence
modules =
    domain

[importlinter:contract:application-forbidden]
name = backend.application must not import adapters, api, worker, or bootstrap
type = forbidden
source_modules =
    backend.application
forbidden_modules =
    backend.adapters
    backend.api
    backend.worker
    backend.bootstrap
    cli

[importlinter:contract:cli-isolation]
name = cli must not import backend internals
type = forbidden
source_modules =
    cli
forbidden_modules =
    backend.adapters
    backend.application
    backend.rag
    backend.ingestion
    backend.worker
    backend.bootstrap
    backend.config
    backend.logging
