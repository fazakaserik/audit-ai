services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://audit:audit@postgres:5432/audit
      DOCUMENT_STORAGE_PATH: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    command: ["uv", "run", "--package", "backend", "audit-worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://audit:audit@postgres:5432/audit
      DOCUMENT_STORAGE_PATH: /data/storage
    volumes:
      - document_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  document_storage:
  ollama_data:
