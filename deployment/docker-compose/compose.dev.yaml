# Dev override: publish internal service ports on the host (loopback only).
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d

name: aiditor-dev

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    environment:
      ENABLE_API_DOCS: "true"
      LOG_LEVEL: "INFO"
      LOG_JSON: "false"

  upload-processor:
    environment:
      LOG_LEVEL: "INFO"
      LOG_JSON: "false"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
