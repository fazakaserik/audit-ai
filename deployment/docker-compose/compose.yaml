name: auditor-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://audit:audit@postgres:5432/audit
      DOCUMENT_STORAGE_PATH: /data/storage
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RUN_WORKER_IN_API: "true"
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional in-compose Ollama. Prefer host Ollama for GPU day-to-day.
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    profiles: ["local"]
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen3.5:4b
        ollama pull nomic-embed-text
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  postgres_data:
  document_storage:
  ollama_data:
