[project]
name = "backend"
version = "0.1.0"
description = "AIditor backend (HTTP API, business logic, ingestion worker). Linux-only; Windows is not supported."
requires-python = ">=3.13,<3.14"
classifiers = [
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "pydantic>=2.14,<2.15",
  "fastapi>=0.163,<0.164",
  "uvicorn[standard]>=0.54,<0.55",
  "python-multipart>=0.0.20,<0.1",
  "pydantic-settings>=2.16,<2.17",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32,<0.33",
  "pgvector>=0.5,<0.6",
  "alembic>=1.20,<1.21",
  "litellm>=1.109,<1.110",
  "httpx>=0.28,<0.29",
  "tenacity>=9.2,<9.3",
  "structlog>=26.1,<26.2",
  "langgraph>=1.2,<1.3",
  "pypdf>=7.1,<7.2",
  "markitdown[pdf,docx,pptx,xlsx]>=0.1,<0.2",
  "tiktoken>=0.14,<0.15",
]

[project.scripts]
audit-api = "backend.application.api.main:run"
audit-worker = "backend.application.rag.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
