[project]
name = "backend"
version = "0.1.0"
description = "Audit Assistant backend (HTTP API, business logic, ingestion worker)"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "alembic>=1.14",
  "openai>=1.60",
  "ollama>=0.4",
  "tenacity>=9.0",
  "structlog>=24.4",
  "langgraph>=0.2",
  "pypdf>=5.1",
  "tiktoken>=0.8",
]

[project.scripts]
audit-api = "backend.application.api.main:run"
audit-worker = "backend.application.rag.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
