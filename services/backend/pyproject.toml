[project]
name = "backend"
version = "0.1.0"
description = "AIditor backend (HTTP API, business logic, ingestion worker). Linux-only; Windows is not supported."
requires-python = ">=3.13"
classifiers = [
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "pydantic>=2.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "alembic>=1.14",
  "litellm>=1.75",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "langgraph>=0.2",
  "pypdf>=5.1",
  "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
  "tiktoken>=0.8",
]

[project.scripts]
audit-api = "backend.application.api.main:run"
audit-worker = "backend.application.rag.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
