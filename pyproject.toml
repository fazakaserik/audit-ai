[project]
name = "audit-ai"
version = "0.1.0"
description = "Document-grounded auditor assistant (RAG)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
  "services/backend",
  "cli",
]

[dependency-groups]
dev = [
  "basedpyright>=1.28.0",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "testcontainers[postgres]>=4.9",
  "httpx>=0.28",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".specify", ".cursor"]
src = [
  "services/backend/src",
  "services/backend/tests",
  "cli/src",
  "cli/tests",
  "scripts",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
  "RUF",
  "TCH",
]
ignore = ["E501", "TCH"]

[tool.ruff.lint.per-file-ignores]
"cli/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: offline unit tests (default)",
  "db: Postgres+pgvector via testcontainers",
  "integration: real Ollama/OpenAI (opt-in)",
]
testpaths = [
  "services/backend/tests",
  "cli/tests",
]
pythonpath = [
  "services/backend/src",
  "services/backend/tests",
  "cli/src",
]
# Disable langsmith's pytest plugin: it imports xxhash at collection time, which
# fails on AppLocker hosts before our native-wheel shims can run.
addopts = "-m \"not db and not integration\" -p no:langsmith"

[tool.basedpyright]
include = [
  "services/backend/src",
  "services/backend/tests",
  "cli/src",
  "cli/tests",
  "scripts",
]
exclude = [
  "**/__pycache__",
  ".venv",
]
stubPath = "typings"
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportAny = true
reportExplicitAny = true
