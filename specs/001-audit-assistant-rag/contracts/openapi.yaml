openapi: 3.1.0
info:
  title: AIditor API
  version: 1.0.0
  description: |
    Document-grounded Q&A for auditors. Business routes are under `/api/v1`.
    Errors use RFC 9457 Problem Details (`application/problem+json`) with a stable `code`
    and `request_id`. Ask responses are a discriminated union on `status`.
servers:
  - url: http://localhost:8000
    description: Local docker-compose API
tags:
  - name: health
  - name: engagements
  - name: documents
  - name: uploads
  - name: ask
  - name: sessions
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"

  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness probe
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements:
    get:
      tags: [engagements]
      operationId: listEngagements
      summary: List engagements
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of engagements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementPage"
    post:
      tags: [engagements]
      operationId: createEngagement
      summary: Create an engagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngagementRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResponse"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}:
    get:
      tags: [engagements]
      operationId: getEngagement
      summary: Get one engagement
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      responses:
        "200":
          description: Engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementResponse"
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents and child folders
      description: >
        List documents under a folder prefix. Optional depth limits how many path
        levels under the prefix are returned. Immediate child folders are always included.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: Folder to list under; omit or empty for the engagement root
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: How many path levels under prefix to return; omit for all levels
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Documents within depth plus immediate child folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListingResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [uploads]
      operationId: uploadDocuments
      summary: Upload documents
      description: Queue files for async ingest into an engagement folder.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [folder, files]
              properties:
                folder:
                  type: string
                  description: Target folder path under the engagement (POSIX, relative)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
      responses:
        "202":
          description: Upload accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAcceptedResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/documents/{document_path}:
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Download a document
      description: Return the raw bytes for one document.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - name: document_path
          in: path
          required: true
          schema:
            type: string
          style: path
          explode: false
          description: Full relative document path
      responses:
        "200":
          description: Raw file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/uploads:
    get:
      tags: [uploads]
      operationId: listUploads
      summary: List uploads
      description: List upload jobs for an engagement, newest first.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of upload summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSummaryPage"
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/uploads/{upload_id}:
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get upload details
      description: Return upload status and per-file outcomes.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Upload job to inspect
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/ask:
    post:
      tags: [ask]
      operationId: askQuestion
      summary: Ask a question (creates or continues a session)
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Answer or insufficient evidence (always includes session_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/ask/stream:
    post:
      tags: [ask]
      operationId: askQuestionStream
      summary: Ask a question with SSE progress
      description: >
        Streams agent stages, tool_call / tool_result events, retrieved sources,
        optional thinking deltas, a single thinking_done (Thought for X seconds),
        then a final AskResponse. Thinking events appear only when the chat
        provider reports thinking support.
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: text/event-stream of progress events then final
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions for an engagement (newest activity first)
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of session summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryPage"
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/engagements/{engagement_id}/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session with all turns
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "404":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    EngagementId:
      name: engagement_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    LiveResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok:
                type: boolean
              detail:
                type: string

    CreateEngagementRequest:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        name:
          type: string
          minLength: 1
          maxLength: 200

    EngagementResponse:
      type: object
      additionalProperties: false
      required: [id, name, document_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        document_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          path,
          content_type,
          size_bytes,
          searchable,
          version,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        content_type:
          type: string
          enum: [markdown, text, pdf]
        size_bytes:
          type: integer
          minimum: 0
        searchable:
          type: boolean
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UploadAcceptedResponse:
      type: object
      additionalProperties: false
      required: [upload_id, status, request_id]
      properties:
        upload_id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
        request_id:
          type: string
          format: uuid

    UploadItemResponse:
      type: object
      additionalProperties: false
      required: [id, document_path, status]
      properties:
        id:
          type: string
          format: uuid
        document_path:
          type: string
        status:
          type: string
          enum: [pending, processing, indexed, skipped, not_searchable, failed]
        reason:
          type: string
          nullable: true

    UploadSummaryResponse:
      type: object
      additionalProperties: false
      required:
        [id, engagement_id, target_folder, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        engagement_id:
          type: string
        target_folder:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UploadResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          engagement_id,
          target_folder,
          status,
          items,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        engagement_id:
          type: string
        target_folder:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        completed_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/UploadItemResponse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        session_id:
          type: string
          format: uuid
          description: Omit to start a new session; response always returns session_id
        folder_prefix:
          type: string
          nullable: true
        auditor_role:
          type: string
          maxLength: 200
          nullable: true
        topic:
          type: string
          maxLength: 200
          nullable: true

    Citation:
      type: object
      additionalProperties: false
      required: [marker, document_path, snippet, score, chunk_id, document_id]
      properties:
        marker:
          type: integer
          minimum: 1
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_path:
          type: string
        page:
          type: integer
          minimum: 1
          nullable: true
        heading_path:
          type: array
          items:
            type: string
        snippet:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1

    SuggestedClientQuestion:
      type: object
      additionalProperties: false
      required: [question, rationale]
      properties:
        question:
          type: string
        rationale:
          type: string

    LlmUsage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    AnsweredResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - answer
        - citations
        - session_id
        - turn_id
        - request_id
        - usage
        - session_total_tokens
      properties:
        status:
          type: string
          const: answered
        answer:
          type: string
          description: Markdown text with inline [n] citation markers
        citations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Citation"
        session_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        usage:
          $ref: "#/components/schemas/LlmUsage"
        session_total_tokens:
          type: integer
          minimum: 0
          description: Cumulative total_tokens for this session after the turn

    InsufficientEvidenceResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
        - partial_citations
        - suggested_client_questions
        - session_id
        - turn_id
        - request_id
        - usage
        - session_total_tokens
      properties:
        status:
          type: string
          const: insufficient_evidence
        reason:
          type: string
          enum: [no_relevant_chunks, model_judged_insufficient]
        partial_citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        uncertainties:
          type: array
          maxItems: 5
          items:
            type: string
          description: Concrete gaps or ambiguities that blocked a grounded answer
          default: []
        suggested_client_questions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/SuggestedClientQuestion"
        session_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        usage:
          $ref: "#/components/schemas/LlmUsage"
        session_total_tokens:
          type: integer
          minimum: 0
          description: Cumulative total_tokens for this session after the turn

    AskResponse:
      oneOf:
        - $ref: "#/components/schemas/AnsweredResponse"
        - $ref: "#/components/schemas/InsufficientEvidenceResponse"
      discriminator:
        propertyName: status
        mapping:
          answered: "#/components/schemas/AnsweredResponse"
          insufficient_evidence: "#/components/schemas/InsufficientEvidenceResponse"

    SessionSummaryResponse:
      type: object
      additionalProperties: false
      required: [id, engagement_id, title, turn_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        engagement_id:
          type: string
        title:
          type: string
        turn_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TurnResponse:
      type: object
      additionalProperties: false
      required: [id, ordinal, question, standalone_question, answer, created_at]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 0
        question:
          $ref: "#/components/schemas/AskRequest"
        standalone_question:
          type: string
        answer:
          $ref: "#/components/schemas/AskResponse"
        created_at:
          type: string
          format: date-time
        thinking_text:
          type: string
          nullable: true
          description: Native model thinking transcript for this turn (if any)
        thinking_seconds:
          type: number
          nullable: true
          description: Wall-clock seconds spent in thinking-capable chat calls

    SessionDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SessionSummaryResponse"
        - type: object
          additionalProperties: false
          required: [turns]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/TurnResponse"

    PageMeta:
      type: object
      additionalProperties: false
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    EngagementPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EngagementResponse"

    DocumentListingResponse:
      type: object
      additionalProperties: false
      required: [items, folders, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentResponse"
        folders:
          type: array
          items:
            type: string
          description: Immediate child folder names under the prefix
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0

    UploadSummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UploadSummaryResponse"

    SessionSummaryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SessionSummaryResponse"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - validation_error
            - not_found
            - conflict
            - payload_too_large
            - unsafe_upload
            - model_timeout
            - model_unavailable
            - dependency_unavailable
            - internal_error
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
