[project]
name = "cli"
version = "0.1.0"
description = "Non-interactive terminal client and HTTP library for AIditor"
requires-python = ">=3.13,<3.14"
dependencies = [
  "backend",
  "httpx>=0.28,<0.29",
  "typer>=0.29,<0.30",
  "rich>=15.0,<15.1",
]

[project.scripts]
aiditor = "cli.main:app"

[tool.uv.sources]
backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli/py.typed" = "cli/py.typed"
