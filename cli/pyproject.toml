[project]
name = "cli"
version = "0.1.0"
description = "Interactive terminal client for AIditor"
requires-python = ">=3.13"
dependencies = [
  "backend",
  "httpx>=0.28",
  "typer>=0.15",
  "rich>=13.9",
  "prompt-toolkit>=3.0",
  "questionary>=2.0",
]

[project.scripts]
aiditor = "cli.main:app"

[tool.uv.sources]
backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
